# Local development dependencies only.
# Production uses Cloud SQL + Memorystore (see docs/DEPLOYMENT.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: simplemarket
      POSTGRES_PASSWORD: simplemarket
      POSTGRES_DB: simplemarket
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
