[project]
name = "simplemarket-collectors"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# see backend/pyproject.toml — annotations must eval on py3.9
ignore = ["UP007", "UP017", "UP035", "UP038"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "../backend"
exclude = ["tests/"]
